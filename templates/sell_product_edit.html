{% extends "base.html" %}
{% block title %}تعديل منتج{% endblock %}
{% block content %}
<div class="form-card" style="max-width:600px">
<h2>✏️ تعديل المنتج</h2>
<form method="post" enctype="multipart/form-data">
<div class="field"><label>اسم المنتج</label><input name="name" value="{{ p.name }}" required></div>
<div class="field"><label>الوصف</label><textarea name="description" rows="4">{{ p.description or '' }}</textarea></div>
<div class="field"><label>السعر</label><input name="price" type="number" step="0.01" value="{{ p.price }}" required></div>
<div class="field"><label>الفئة</label><select name="category_id">
{% for c in categories %}<option value="{{ c.id }}" {% if c.id == p.category_id %}selected{% endif %}>{{ c.icon }} {{ c.name }}</option>{% endfor %}
</select></div>
<div class="field"><label>الحالة</label><select name="condition_type">
<option {% if p.condition_type == 'جديد' %}selected{% endif %}>جديد</option>
<option {% if p.condition_type == 'مستعمل - بحالة جيدة' %}selected{% endif %}>مستعمل - بحالة جيدة</option>
<option {% if p.condition_type == 'مستعمل - عادي' %}selected{% endif %}>مستعمل - عادي</option>
<option {% if p.condition_type == 'مستعمل - يحتاج إصلاح' %}selected{% endif %}>مستعمل - يحتاج إصلاح</option>
</select></div>
<div class="field"><label>المدينة</label><input name="city" value="{{ p.city or '' }}"></div>
<div class="field"><label>الكمية</label><input name="stock" type="number" value="{{ p.stock }}" min="0"></div>
<div class="field"><label>الحالة</label><select name="status">
<option {% if p.status == 'متوفر' %}selected{% endif %}>متوفر</option>
<option {% if p.status == 'مباع' %}selected{% endif %}>مباع</option>
<option {% if p.status == 'محجوز' %}selected{% endif %}>محجوز</option>
</select></div>
{% if p.image1 %}<div class="field"><label>صورة حالية 1</label><img src="/static/uploads/{{ p.image1 }}" style="max-width:100%;border-radius:8px;margin-top:6px"></div>{% endif %}
<div class="field"><label>تغيير الصورة 1</label><input name="image1_file" type="file" accept="image/*"></div>
{% if p.image2 %}<div class="field"><label>صورة حالية 2</label><img src="/static/uploads/{{ p.image2 }}" style="max-width:100%;border-radius:8px;margin-top:6px"></div>{% endif %}
<div class="field"><label>تغيير الصورة 2</label><input name="image2_file" type="file" accept="image/*"></div>
{% if p.image3 %}<div class="field"><label>صورة حالية 3</label><img src="/static/uploads/{{ p.image3 }}" style="max-width:100%;border-radius:8px;margin-top:6px"></div>{% endif %}
<div class="field"><label>تغيير الصورة 3</label><input name="image3_file" type="file" accept="image/*"></div>
<button class="btn primary" type="submit">✅ حفظ</button>
<a href="/sell/dashboard" class="btn ghost">رجوع</a>
</form>
</div>
{% endblock %}
