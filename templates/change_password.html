{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="form-card">
<h2>Change Password</h2>
<form method="post">
<div class="field"><label>Current password</label><input name="old_pass" type="password" required></div>
<div class="field"><label>New password</label><input name="new_pass" type="password" required minlength="6"></div>
<div class="field"><label>Confirm new password</label><input name="confirm_pass" type="password" required minlength="6"></div>
<button class="btn primary" type="submit">Change</button>
<a href="/admin" class="btn ghost">Cancel</a>
</form>
</div>
{% endblock %}
