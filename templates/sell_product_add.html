{% extends "base.html" %}
{% block title %}إضافة منتج{% endblock %}
{% block content %}
<div class="form-card" style="max-width:600px">
<h2>➕ إضافة منتج جديد</h2>
<form method="post" enctype="multipart/form-data">
<div class="field"><label>اسم المنتج *</label><input name="name" required></div>
<div class="field"><label>الوصف *</label><textarea name="description" rows="4" required placeholder="وصف تفصيلي للمنتج، حالته، عيوبه..."></textarea></div>
<div class="field"><label>السعر (د.م) *</label><input name="price" type="number" step="0.01" required></div>
<div class="field"><label>الفئة</label><select name="category_id">
{% for c in categories %}<option value="{{ c.id }}">{{ c.icon }} {{ c.name }}</option>{% endfor %}
</select></div>
<div class="field"><label>الحالة</label><select name="condition_type">
<option>جديد</option><option selected>مستعمل - بحالة جيدة</option><option>مستعمل - عادي</option><option>مستعمل - يحتاج إصلاح</option>
</select></div>
<div class="field"><label>المدينة</label><input name="city" placeholder="الدار البيضاء"></div>
<div class="field"><label>الكمية</label><input name="stock" type="number" value="1" min="1"></div>
<div class="field"><label>الصورة 1</label><input name="image1_file" type="file" accept="image/*"></div>
<div class="field"><label>الصورة 2</label><input name="image2_file" type="file" accept="image/*"></div>
<div class="field"><label>الصورة 3</label><input name="image3_file" type="file" accept="image/*"></div>
<button class="btn primary" type="submit">✅ إضافة المنتج</button>
<a href="/sell/dashboard" class="btn ghost">رجوع</a>
</form>
</div>
{% endblock %}
