{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div class="form-card" style="max-width:600px">
<h2>Edit Product</h2>
<form method="post" enctype="multipart/form-data">
<div class="field"><label>Name</label><input name="name" value="{{ p.name }}" required></div>
<div class="field"><label>Description</label><textarea name="description" rows="3">{{ p.description or "" }}</textarea></div>
<div class="field"><label>Price</label><input name="price" type="number" step="0.01" value="{{ p.price }}" required></div>
<div class="field"><label>Old Price</label><input name="old_price" type="number" step="0.01" value="{{ p.old_price or 0 }}"></div>
<div class="field"><label>Icon/Image</label><input name="image" value="{{ p.image }}"></div>
<div class="field"><label>📷 تغيير الصورة 1 (رئيسية)</label><input name="image_file" type="file" accept="image/*"></div>
<div class="field"><label>📷 الصورة 2</label><input name="image_file2" type="file" accept="image/*"></div>
<div class="field"><label>📷 الصورة 3</label><input name="image_file3" type="file" accept="image/*"></div>
<div class="field"><label>Category</label>
<select name="category_id">
{% for c in categories %}
<option value="{{ c.id }}" {% if c.id == p.category_id %}selected{% endif %}>{{ c.name }}</option>
{% endfor %}
</select></div>
<div class="field"><label>Stock</label><input name="stock" type="number" value="{{ p.stock }}"></div>
<button class="btn primary" type="submit">Save</button>
<a href="/admin" class="btn ghost">Cancel</a>
</form>
</div>
{% endblock %}
