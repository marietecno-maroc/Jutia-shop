{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="form-card" style="max-width:600px">
<h2>Site Settings</h2>
<form method="post">
<div class="field"><label>Shop name</label><input name="shop_name" value="{{ s.get('shop_name','Jutia') }}"></div>
<div class="field"><label>WhatsApp number (with country code)</label><input name="whatsapp" value="{{ s.get('whatsapp','') }}" placeholder="212600000000"></div>
<div class="field"><label>Email</label><input name="email" value="{{ s.get('email','') }}"></div>
<div class="field"><label>Address</label><input name="address" value="{{ s.get('address','') }}"></div>
<div class="field"><label>Welcome message</label><textarea name="welcome_message" rows="2">{{ s.get('welcome_message','') }}</textarea></div>
<div class="field"><label>Facebook URL</label><input name="facebook" value="{{ s.get('facebook','') }}"></div>
<div class="field"><label>Instagram URL</label><input name="instagram" value="{{ s.get('instagram','') }}"></div>
<button class="btn primary" type="submit">Save</button>
<a href="/admin" class="btn ghost">Cancel</a>
</form>
</div>
{% endblock %}
